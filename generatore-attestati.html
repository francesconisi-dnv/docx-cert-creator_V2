<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Attestati Dinova</title>
    
    <!-- Librerie essenziali -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Google Fonts (Stile pulito e tech) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dinova-purple: #7B2CBF;
            --dinova-purple-dark: #5a1e8f;
            --dinova-purple-light: #f4effa;
            --text-main: #1a1a1a;
            --text-muted: #6b7280;
            --bg-page: #f9fafb;
            --bg-card: #ffffff;
            --border-color: #e5e7eb;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-page); 
            background-image: radial-gradient(circle at top right, #f4effa 0%, transparent 40%);
            color: var(--text-main); 
            padding: 40px 20px; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container { 
            width: 100%;
            max-width: 760px; 
            background: var(--bg-card); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.05); 
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 { 
            color: var(--dinova-purple); 
            font-weight: 700;
            font-size: 2.2rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--dinova-purple-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { 
            margin-bottom: 24px; 
        }

        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            font-size: 0.95rem;
        }

        input[type="text"] { 
            width: 100%; 
            padding: 14px 16px; 
            background: var(--bg-page);
            border: 2px solid transparent; 
            border-radius: 10px; 
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            color: var(--text-main);
            box-sizing: border-box; 
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--dinova-purple);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--dinova-purple-light);
        }

        /* Styling personalizzato per l'upload dei file */
        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: var(--bg-page);
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: var(--dinova-purple);
            background: #fdfcff;
        }

        input[type="file"]::file-selector-button {
            background: var(--dinova-purple);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            margin-right: 15px;
            transition: background 0.3s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--dinova-purple-dark);
        }

        .hint {
            display: block;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .btn-generate { 
            width: 100%; 
            padding: 18px; 
            background-color: var(--dinova-purple); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 20px; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.2);
        }

        .btn-generate:hover { 
            background-color: var(--dinova-purple-dark); 
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(123, 44, 191, 0.3);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        #status { 
            margin-top: 24px; 
            text-align: center; 
            font-weight: 600; 
            color: #059669; 
            padding: 12px;
            border-radius: 8px;
        }

        .status-badge { 
            display: inline-flex;
            align-items: center;
            padding: 6px 12px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            margin-top: 8px; 
        }

        .status-ok { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; gap: 0; }
            .container { padding: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Generatore Attestati</h1>
        <p>Dinova Digital Innovation</p>
    </div>
    
    <div class="section-title">📁 File e Risorse</div>

    <div class="form-group">
        <label>Registro Partecipanti (.xlsx)</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <!-- SEZIONE SFONDO -->
    <div class="form-group" style="display: none;">
        <label>Sfondo Attestato</label>
        <div id="bgStatusLabel" class="status-badge status-warn">Verifica sfondo in corso...</div>
        <div id="bgFallback" style="margin-top: 10px; display: none;">
            <input type="file" id="bgFile" accept=".svg, image/png, image/jpeg">
            <span class="hint">Seleziona 'sfondo_pulito.svg'</span>
        </div>
    </div>

    <div class="form-group">
        <label>Logo Aggiuntivo (Opzionale)</label>
        <input type="file" id="logoFile" accept="image/png, image/jpeg">
        <span class="hint">Verrà posizionato in alto a sx (formato consigliato: PNG trasparente)</span>
    </div>

    <div class="section-title" style="margin-top: 40px;">✏️ Dati del Corso</div>

    <div class="grid-2">
        <div class="form-group">
            <label>Monte Ore</label>
            <input type="text" id="oreCorso" value="16">
        </div>

        <div class="form-group">
            <label>Date di svolgimento</label>
            <input type="text" id="dataCorso" value="tenutosi i giorni 12, 13 e 14 ottobre 2026">
        </div>
    </div>

    <div class="form-group">
        <label>Titolo del Corso</label>
        <input type="text" id="nomeCorso" value="Introduzione dell'Intelligenza Artificiale nell'Organizzazione e Gestione dei Servizi Comunali">
    </div>

    <button class="btn-generate" onclick="generaAttestati()">Genera e Scarica PDF (.zip)</button>
    
    <div id="status"></div>
</div>

<script>
    // --- SPOSTAMENTO GLOBALE ---
    const SPOSTAMENTO_VERTICALE = 4; 

    // --- COORDINATE VERTICALI RELATIVE (in millimetri) ---
    const Y_ATTESTATO = 55 + SPOSTAMENTO_VERTICALE;
    const Y_CERTIFICA = 75 + SPOSTAMENTO_VERTICALE;
    const Y_NOME = 95 + SPOSTAMENTO_VERTICALE;
    const Y_ORE = 115 + SPOSTAMENTO_VERTICALE;
    const Y_CORSO = 135 + SPOSTAMENTO_VERTICALE;
    const Y_DATA = 165 + SPOSTAMENTO_VERTICALE;
    
    const CENTRO_X = 297 / 2; 

    const X_LOGO = 15;
    const Y_LOGO = 15;
    const LARGHEZZA_LOGO = 60; 

    let defaultBgBase64 = null;

    window.onload = async function() {
        try {
            const response = await fetch('sfondo_pulito.svg');
            if (response.ok) {
                const blob = await response.blob();
                defaultBgBase64 = await convertiSfondoAdAltaRisoluzione(blob);
                
                const label = document.getElementById('bgStatusLabel');
                label.innerText = "✓ Sfondo predefinito connesso";
                label.className = "status-badge status-ok";
            } else {
                mostraFallbackSfondo("⚠️ Sfondo non trovato");
            }
        } catch (error) {
            mostraFallbackSfondo("⚠️ Blocco di sicurezza locale attivo");
        }
    };

    function mostraFallbackSfondo(messaggio) {
        const label = document.getElementById('bgStatusLabel');
        label.innerText = messaggio;
        label.className = "status-badge status-warn";
        // Mostra interamente la sezione se il caricamento automatico fallisce
        document.getElementById('bgFallback').parentElement.style.display = "block";
        document.getElementById('bgFallback').style.display = "block";
    }

    function convertiSfondoAdAltaRisoluzione(fileOrBlob) {
        return new Promise((resolve, reject) => {
            if (!fileOrBlob) return resolve(null);
            
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 3508; 
                    canvas.height = 2480; 
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/png', 1.0));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(fileOrBlob);
        });
    }

    function caricaLogo(file) {
        return new Promise((resolve, reject) => {
            if (!file) return resolve(null);
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => resolve({ base64: e.target.result, width: img.width, height: img.height });
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function generaAttestati() {
        const excelInput = document.getElementById('excelFile').files[0];
        const bgInput = document.getElementById('bgFile').files[0];
        const logoInput = document.getElementById('logoFile').files[0];
        const ore = document.getElementById('oreCorso').value;
        const nomeCorso = document.getElementById('nomeCorso').value;
        const dataCorso = document.getElementById('dataCorso').value;
        const statusDiv = document.getElementById('status');

        if (!excelInput) {
            alert("⚠️ Per favore, carica prima il file Excel con i partecipanti.");
            return;
        }

        let bgFinalBase64 = defaultBgBase64;
        if (bgInput) {
            bgFinalBase64 = await convertiSfondoAdAltaRisoluzione(bgInput);
        }

        if (!bgFinalBase64) {
            alert("⚠️ Nessuno sfondo disponibile. Assicurati che 'sfondo_pulito.svg' sia nella cartella.");
            return;
        }

        statusDiv.innerText = "⏳ Generazione in corso, attendi qualche istante...";
        statusDiv.style.color = "var(--dinova-purple)";

        try {
            const logoImg = await caricaLogo(logoInput);

            const excelData = await excelInput.arrayBuffer();
            const workbook = XLSX.read(excelData, { type: 'array' });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(worksheet);

            const zip = new JSZip();
            let validCount = 0;

            for (let row of rows) {
                if (row.NOME && row.COGNOME) {
                    validCount++;
                    
                    const nome = String(row.NOME).trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
                    const cognome = String(row.COGNOME).trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
                    const nomeCompleto = `${cognome} ${nome}`;
                    const nomeSicuro = `${cognome}_${nome}`.replace(/\s+/g, '_');

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('l', 'mm', 'a4');

                    doc.addImage(bgFinalBase64, 'PNG', 0, 0, 297, 210);

                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(28);
                    doc.setTextColor(123, 44, 191);
                    doc.text("ATTESTATO DI PARTECIPAZIONE", CENTRO_X, Y_ATTESTATO, { align: "center" });

                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(18);
                    doc.setTextColor(26, 26, 26);
                    doc.text("Si certifica che", CENTRO_X, Y_CERTIFICA, { align: "center" });

                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(34);
                    doc.setTextColor(0, 0, 0);
                    doc.text(nomeCompleto, CENTRO_X, Y_NOME, { align: "center" });

                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(16);
                    doc.setTextColor(26, 26, 26);
                    doc.text(`ha partecipato al corso di ${ore} ore`, CENTRO_X, Y_ORE, { align: "center" });

                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(22);
                    doc.setTextColor(123, 44, 191);
                    doc.text(nomeCorso, CENTRO_X, Y_CORSO, { align: "center", maxWidth: 220 });

                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(16);
                    doc.setTextColor(26, 26, 26);
                    doc.text(dataCorso, CENTRO_X, Y_DATA, { align: "center" });

                    if (logoImg) {
                        const altezzaProporzionata = (LARGHEZZA_LOGO * logoImg.height) / logoImg.width;
                        doc.addImage(logoImg.base64, 'PNG', X_LOGO, Y_LOGO, LARGHEZZA_LOGO, altezzaProporzionata);
                    }

                    const pdfBlob = doc.output('blob');
                    zip.file(`Attestato_${nomeSicuro}_${ore}.pdf`, pdfBlob);
                }
            }

            if (validCount === 0) {
                statusDiv.innerText = "❌ Errore: Nessun dato trovato. Verifica le colonne 'NOME' e 'COGNOME'.";
                statusDiv.style.color = "#dc2626";
                return;
            }

            statusDiv.innerText = `✅ Completato! Sono stati scaricati ${validCount} attestati.`;
            statusDiv.style.color = "#059669";
            
            const content = await zip.generateAsync({ type: "blob" });
            saveAs(content, "Attestati_Dinova.zip");

        } catch (error) {
            statusDiv.innerText = `❌ Si è verificato un errore: ${error.message}`;
            statusDiv.style.color = "#dc2626";
            console.error(error);
        }
    }
</script>

</body>
</html>
